[package]
name = "vocelle"
version = "0.1.0"
description = "Local voice dictation for Windows"
edition = "2021"
publish = false

[lib]
name = "vocelle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# GPU speech recognition on NVIDIA, AMD and Intel GPUs. Needs the Vulkan SDK to build.
vulkan = ["whisper-rs/vulkan"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18"
arboard = "3"
whisper-rs = "0.16"
ureq = "3"
sha2 = "0.10"

[dev-dependencies]
hound = "3"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
