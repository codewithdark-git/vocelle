name: Release

# Pushing a version tag (v1.2.3) builds the Windows and Linux installers and
# attaches them to a draft GitHub release. A maintainer smoke-tests the
# installers, then publishes the draft.
on:
  push:
    tags: ["v*"]

# Nothing by default; each job asks only for what it needs.
permissions: {}

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches the app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p "require('./package.json').version")
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag doesn't match package.json version $version"
            exit 1
          fi

      - name: Create draft release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-notes.mjs "$GITHUB_REF_NAME" > notes.md
          # The create call returns the id directly; listing releases right
          # after creating one can miss it.
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" -f name="Vocelle ${GITHUB_REF_NAME#v}" \
            -F body=@notes.md -F draft=true --jq .id)
          if [ -z "$id" ]; then
            echo "::error::Couldn't create the draft release"
            exit 1
          fi
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          # 22.04 keeps the AppImage compatible with older glibc versions.
          - os: ubuntu-22.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # Pinned by commit, so the toolchain must be named here.
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: release

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libasound2-dev libxtst-dev libx11-dev \
            libclang-dev cmake
          # llvm-config can point at an LLVM without libclang; find the library itself.
          libclang=$(ls /usr/lib/llvm-*/lib/libclang.so* /usr/lib/x86_64-linux-gnu/libclang*.so* 2>/dev/null | head -1)
          echo "LIBCLANG_PATH=$(dirname "$libclang")" >> "$GITHUB_ENV"

      - name: Windows build settings
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> "$GITHUB_ENV"
          # The cmake crate replaces CMake's Release flags on MSVC and drops
          # the optimization level, so whisper.cpp would be built without
          # optimizations (about 7x slower). Defining them keeps -O2.
          echo "CMAKE_C_FLAGS_RELEASE=-MD -O2 -Ob2 -DNDEBUG" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_FLAGS_RELEASE=-MD -O2 -Ob2 -DNDEBUG" >> "$GITHUB_ENV"

      - run: npm ci

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          releaseId: ${{ needs.draft.outputs.release_id }}
          args: --bundles ${{ matrix.bundles }}

      - name: Check the speech engine was optimized
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cache=$(ls src-tauri/target/release/build/whisper-rs-sys-*/out/build/CMakeCache.txt | head -1)
          grep -E "^CMAKE_CXX_FLAGS_RELEASE:" "$cache"
          if ! grep -qE "^CMAKE_CXX_FLAGS_RELEASE:STRING=.*-O2" "$cache"; then
            echo "::error::whisper.cpp was built without -O2; don't publish this draft"
            exit 1
          fi
